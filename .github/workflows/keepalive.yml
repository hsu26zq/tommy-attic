# Supabase pauses free projects after 7 days without activity.
# This makes one tiny read every day so the database stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        run: |
          curl -fsS "https://fsjxyrfozzgmaebulfmo.supabase.co/rest/v1/notes?select=id&is_public=eq.true&limit=1" \
            -H "apikey: sb_publishable_WvRd7sAOTQwU-O-dygnWYQ_2MlJEPGs" > /dev/null
          echo "Supabase is awake"
