# Render's free plan sleeps after 15 minutes idle; Supabase pauses after 7 days.
# Ping the backend every 5 minutes so it never sleeps (one service fits in 750 free hours).
name: Keep awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS --retry 3 --max-time 90 https://tommy-attic.onrender.com/health > /dev/null
      - name: Read one public row from Supabase
        run: |
          curl -fsS "https://fsjxyrfozzgmaebulfmo.supabase.co/rest/v1/notes?select=id&is_public=eq.true&limit=1" \
            -H "apikey: sb_publishable_WvRd7sAOTQwU-O-dygnWYQ_2MlJEPGs" > /dev/null
